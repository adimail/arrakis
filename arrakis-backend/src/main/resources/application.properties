spring.application.name=arrakis-backend

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/arrakis_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=rootpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Shopify API Configuration
shopify.store-domain=${SHOPIFY_STORE_DOMAIN:arrakis-kjdmht69.myshopify.com}
shopify.access-token=${SHOPIFY_ACCESS_TOKEN}
