spring.application.name=arrakis-backend

spring.datasource.url=jdbc:mysql://localhost:3306/arrakis_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=rootpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

shopify.store-domain=${SHOPIFY_STORE_DOMAIN:arrakis-kjdmht69.myshopify.com}
shopify.access-token=${SHOPIFY_ACCESS_TOKEN}
shopify.api-version=${SHOPIFY_API_VERSION:2025-01}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

logging.level.org.springframework.data.web.config.SpringDataWebSettings=ERROR